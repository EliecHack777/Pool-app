<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

<title>Pool App</title>

<style>

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    overflow:hidden;
    touch-action:none;
}

body{
    text-align:center;
}

h1{
    margin:10px 0 3px;
    font-size:24px;
}

p{
    margin:0 0 8px;
    color:#aaa;
}

#table{
    position:relative;

    width:94vw;
    max-width:900px;

    aspect-ratio:2/1;

    margin:auto;

    background:#08733c;

    border:18px solid #5b321c;
    border-radius:12px;

    overflow:hidden;

    touch-action:none;
    user-select:none;
}


/* =========================
   TRONERAS
   ========================= */

.pocket{
    position:absolute;

    width:7%;
    aspect-ratio:1;

    background:#050505;

    border-radius:50%;

    z-index:2;
}

.p1{left:-3.5%;top:-3.5%}
.p2{right:-3.5%;top:-3.5%}
.p3{left:-3.5%;bottom:-3.5%}
.p4{right:-3.5%;bottom:-3.5%}
.p5{left:46.5%;top:-5%}
.p6{left:46.5%;bottom:-5%}


/* =========================
   BOLAS
   ========================= */

.ball{
    position:absolute;

    width:5%;
    aspect-ratio:1;

    border-radius:50%;

    transform:translate(-50%,-50%);

    pointer-events:none;

    z-index:15;
}

#cueBall{
    left:25%;
    top:50%;

    background:white;

    box-shadow:
    0 2px 5px rgba(0,0,0,.5);
}

#target{
    left:70%;
    top:50%;

    background:#e63946;
}


/* =========================
   LÍNEA DE TIRO
   ========================= */

.trajectory{
    position:absolute;

    height:3px;

    background:white;

    transform-origin:0 50%;

    z-index:6;

    pointer-events:none;
}


/* =========================
   PUNTO DE CONTACTO
   ========================= */

.contactPoint{
    position:absolute;

    width:11px;
    height:11px;

    background:#ffd166;

    border-radius:50%;

    transform:translate(-50%,-50%);

    z-index:9;

    pointer-events:none;

    box-shadow:
    0 0 6px rgba(255,209,102,.9);
}


/* =========================
   LÍNEA DE SALIDA
   ========================= */

.contactLine{
    position:absolute;

    height:3px;

    background:#ffd166;

    transform-origin:0 50%;

    z-index:7;

    pointer-events:none;
}


/* =========================
   PUNTOS DE REBOTE
   ========================= */

.bounce{
    position:absolute;

    width:10px;
    height:10px;

    background:#64d8ff;

    border-radius:50%;

    transform:translate(-50%,-50%);

    z-index:8;

    pointer-events:none;

    box-shadow:
    0 0 5px rgba(100,216,255,.8);
}


/* =========================
   ESTADO
   ========================= */

#status{
    margin:8px;

    color:#aaa;

    min-height:20px;
}


/* =========================
   BOTÓN
   ========================= */

button{
    padding:10px 20px;

    border:0;

    border-radius:8px;

    font-weight:bold;

    font-size:14px;
}

</style>
</head>


<body>

<h1>🎱 Pool App</h1>

<p>
Desliza el dedo sobre la mesa para apuntar
</p>


<div id="table">

    <!-- TRONERAS -->

    <div class="pocket p1"></div>
    <div class="pocket p2"></div>
    <div class="pocket p3"></div>
    <div class="pocket p4"></div>
    <div class="pocket p5"></div>
    <div class="pocket p6"></div>


    <!-- BOLAS -->

    <div
        id="cueBall"
        class="ball">
    </div>

    <div
        id="target"
        class="ball">
    </div>

</div>


<div id="status">
Listo
</div>


<button onclick="resetAim()">
Reiniciar
</button>


<script>


/* =========================
   ELEMENTOS
   ========================= */

const table =
document.getElementById("table");

const status =
document.getElementById("status");


/* =========================
   LIMPIAR
   ========================= */

function clearTrajectory(){

    document
    .querySelectorAll(
        ".trajectory,"+
        ".contactPoint,"+
        ".contactLine,"+
        ".bounce"
    )
    .forEach(
        element =>
        element.remove()
    );

}


/* =========================
   CREAR LÍNEA
   ========================= */

function createLine(
    className,
    x1,
    y1,
    x2,
    y2
){

    const element =
    document.createElement("div");

    element.className =
        className;


    const dx =
        x2-x1;

    const dy =
        y2-y1;


    const length =
        Math.sqrt(
            dx*dx+
            dy*dy
        );


    const angle =
        Math.atan2(
            dy,
            dx
        );


    element.style.left =
        x1+"px";

    element.style.top =
        y1+"px";

    element.style.width =
        length+"px";

    element.style.transform =
        "rotate("+
        angle+
        "rad)";


    table.appendChild(element);

}


/* =========================
   CREAR PUNTO
   ========================= */

function createPoint(
    className,
    x,
    y
){

    const element =
    document.createElement("div");

    element.className =
        className;

    element.style.left =
        x+"px";

    element.style.top =
        y+"px";


    table.appendChild(element);

}


/* =========================
   DIBUJAR TRAYECTORIA
   ========================= */

function drawTrajectory(angle){

    clearTrajectory();


    const width =
        table.clientWidth;

    const height =
        table.clientHeight;


    /*
     * RADIO DE LA BOLA
     */

    const radius =
        width*0.025;


    /*
     * CENTRO DE LA BOLA BLANCA
     */

    const cueX =
        width*0.25;

    const cueY =
        height*0.50;


    /*
     * CENTRO DE LA BOLA ROJA
     */

    const targetX =
        width*0.70;

    const targetY =
        height*0.50;


    /*
     * DIRECCIÓN
     */

    const dx =
        Math.cos(angle);

    const dy =
        Math.sin(angle);


    /*
     * PROYECCIÓN DE LA LÍNEA
     *
     * La línea se extiende
     * hasta encontrar la zona
     * de la bola roja.
     */

    const contactX =
        targetX -
        dx*radius*2;

    const contactY =
        targetY -
        dy*radius*2;


    /*
     * LÍNEA BLANCA
     */

    createLine(
        "trajectory",

        cueX,
        cueY,

        contactX,
        contactY
    );


    /*
     * PUNTO DE CONTACTO
     */

    createPoint(
        "contactPoint",

        contactX,
        contactY
    );


    /*
     * DIRECCIÓN DE SALIDA
     *
     * La bola roja sale en la
     * dirección de la línea
     * entre ambas bolas.
     */

    let outX =
        targetX-cueX;

    let outY =
        targetY-cueY;


    const outLength =
        Math.sqrt(
            outX*outX+
            outY*outY
        );


    if(outLength===0)
        return;


    outX /=
        outLength;

    outY /=
        outLength;


    /*
     * LONGITUD DE LA SALIDA
     */

    const exitLength =
        Math.max(
            width,
            height
        )*3;


    const exitX =
        targetX+
        outX*exitLength;

    const exitY =
        targetY+
        outY*exitLength;


    /*
     * LÍNEA AMARILLA
     */

    createLine(
        "contactLine",

        targetX,
        targetY,

        exitX,
        exitY
    );


    /*
     * =====================
     * REBOTES
     * =====================
     */

    let x =
        targetX;

    let y =
        targetY;

    let vx =
        outX;

    let vy =
        outY;


    /*
     * LÍMITES PARA EL
     * CENTRO DE LA BOLA
     */

    const left =
        radius;

    const right =
        width-radius;

    const top =
        radius;

    const bottom =
        height-radius;


    /*
     * DISTANCIA TOTAL
     */

    let remaining =
        Math.max(
            width,
            height
        )*12;


    /*
     * MÁXIMO DE REBOTES
     */

    let bounceCount=0;


    while(
        remaining>0 &&
        bounceCount<8
    ){

        let distanceX=
            Infinity;

        let distanceY=
            Infinity;


        /*
         * BANDA VERTICAL
         */

        if(vx>0){

            distanceX =
                (right-x)/vx;

        }
        else if(vx<0){

            distanceX =
                (left-x)/vx;

        }


        /*
         * BANDA HORIZONTAL
         */

        if(vy>0){

            distanceY =
                (bottom-y)/vy;

        }
        else if(vy<0){

            distanceY =
                (top-y)/vy;

        }


        /*
         * PRÓXIMO IMPACTO
         */

        const distance =
            Math.min(
                distanceX,
                distanceY
            );


        /*
         * NO HAY MÁS BANDAS
         */

        if(
            !isFinite(distance) ||
            distance>=remaining
        ){

            break;

        }


        /*
         * PUNTO DE IMPACTO
         */

        const hitX =
            x+
            vx*distance;

        const hitY =
            y+
            vy*distance;


        /*
         * PUNTO AZUL
         */

        createPoint(
            "bounce",
            hitX,
            hitY
        );


        /*
         * REBOTE
         */

        if(
            Math.abs(
                distance-distanceX
            ) <
            Math.abs(
                distance-distanceY
            )
        ){

            vx =
                -vx;

        }
        else{

            vy =
                -vy;

        }


        /*
         * Separar un poco
         * la bola de la banda.
         */

        x =
            hitX+
            vx*0.5;

        y =
            hitY+
            vy*0.5;


        remaining -=
            distance;


        bounceCount++;

    }

}


/* =========================
   APUNTADO
   ========================= */

function updateAim(
    clientX,
    clientY
){

    const rect =
        table.getBoundingClientRect();


    /*
     * POSICIÓN DE LA BLANCA
     */

    const cueX =
        rect.left+
        rect.width*0.25;

    const cueY =
        rect.top+
        rect.height*0.50;


    /*
     * VECTOR HACIA EL DEDO
     */

    const dx =
        clientX-cueX;

    const dy =
        clientY-cueY;


    /*
     * ÁNGULO
     */

    const angle =
        Math.atan2(
            dy,
            dx
        );


    drawTrajectory(angle);


    status.textContent =
        "Apuntando";

}


/* =========================
   TOUCH START
   ========================= */

table.addEventListener(
"touchstart",
function(e){

    e.preventDefault();


    const touch =
        e.touches[0];


    updateAim(
        touch.clientX,
        touch.clientY
    );

},
{
    passive:false
});


/* =========================
   TOUCH MOVE
   ========================= */

table.addEventListener(
"touchmove",
function(e){

    e.preventDefault();


    const touch =
        e.touches[0];


    updateAim(
        touch.clientX,
        touch.clientY
    );

},
{
    passive:false
});


/* =========================
   TOUCH END
   ========================= */

table.addEventListener(
"touchend",
function(e){

    e.preventDefault();

    status.textContent =
        "Listo";

},
{
    passive:false
});


/* =========================
   REINICIAR
   ========================= */

function resetAim(){

    clearTrajectory();

    drawTrajectory(0);

    status.textContent =
        "Listo";

}


/* =========================
   INICIO
   ========================= */

drawTrajectory(0);


/* =========================
   REDIMENSIONAR
   ========================= */

window.addEventListener(
"resize",
function(){

    drawTrajectory(0);

});

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Pool App</title>

<style>

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    overflow:hidden;
    touch-action:none;
}

body{
    text-align:center;
}

h1{
    margin:10px 0 3px;
    font-size:24px;
}

p{
    margin:0 0 8px;
    color:#aaa;
}

#table{
    position:relative;
    width:94vw;
    max-width:900px;
    aspect-ratio:2/1;
    margin:auto;

    background:#08733c;

    border:18px solid #5b321c;
    border-radius:12px;

    overflow:hidden;

    touch-action:none;
    user-select:none;
}

.pocket{
    position:absolute;
    width:7%;
    aspect-ratio:1;
    background:#050505;
    border-radius:50%;
}

.p1{left:-3.5%;top:-3.5%}
.p2{right:-3.5%;top:-3.5%}
.p3{left:-3.5%;bottom:-3.5%}
.p4{right:-3.5%;bottom:-3.5%}
.p5{left:46.5%;top:-5%}
.p6{left:46.5%;bottom:-5%}

#cueBall,
#target{
    position:absolute;
    width:5%;
    aspect-ratio:1;
    border-radius:50%;
    transform:translate(-50%,-50%);
    pointer-events:none;
}

#cueBall{
    left:25%;
    top:50%;
    background:white;
}

#target{
    left:70%;
    top:50%;
    background:#e63946;
}

#aimLine{
    position:absolute;

    left:25%;
    top:50%;

    width:900px;
    height:4px;

    background:white;

    transform-origin:0 50%;

    pointer-events:none;
}

#touchArea{
    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:100%;

    z-index:20;

    background:transparent;

    touch-action:none;
}

#status{
    margin:8px;
    color:#aaa;
}

button{
    padding:10px 20px;
    border:0;
    border-radius:8px;
    font-weight:bold;
}

</style>
</head>

<body>

<h1>🎱 Pool App</h1>

<p>Mantén el dedo y mueve para apuntar</p>

<div id="table">

    <div class="pocket p1"></div>
    <div class="pocket p2"></div>
    <div class="pocket p3"></div>
    <div class="pocket p4"></div>
    <div class="pocket p5"></div>
    <div class="pocket p6"></div>

    <div id="aimLine"></div>

    <div id="cueBall"></div>
    <div id="target"></div>

    <div id="touchArea"></div>

</div>

<div id="status">
    Listo
</div>

<button onclick="resetAim()">
    Reiniciar
</button>

<script>

const table =
document.getElementById("table");

const touchArea =
document.getElementById("touchArea");

const line =
document.getElementById("aimLine");

const status =
document.getElementById("status");

let active = false;


/* CALCULAR DIRECCIÓN */

function update(x,y){

    const rect =
    table.getBoundingClientRect();

    const ballX =
    rect.left + rect.width * 0.25;

    const ballY =
    rect.top + rect.height * 0.50;

    const dx =
    x - ballX;

    const dy =
    y - ballY;

    const angle =
    Math.atan2(dy,dx);

    line.style.transform =
    "rotate(" + angle + "rad)";

    status.textContent =
    "Apuntando";
}


/* COMIENZA EL TOQUE */

touchArea.addEventListener(
"touchstart",
function(e){

    e.preventDefault();

    active = true;

    const t =
    e.touches[0];

    update(
        t.clientX,
        t.clientY
    );

},
{passive:false}
);


/* MOVIMIENTO CONTINUO */

touchArea.addEventListener(
"touchmove",
function(e){

    e.preventDefault();

    if(!active)
        return;

    const t =
    e.touches[0];

    update(
        t.clientX,
        t.clientY
    );

},
{passive:false}
);


/* TERMINA EL TOQUE */

touchArea.addEventListener(
"touchend",
function(e){

    e.preventDefault();

    active = false;

    status.textContent =
    "Listo";

},
{passive:false}
);


/* CANCELACIÓN */

touchArea.addEventListener(
"touchcancel",
function(){

    active = false;

});


function resetAim(){

    line.style.transform =
    "rotate(0rad)";

    status.textContent =
    "Listo";
}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

<title>Pool App</title>

<style>

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    touch-action:none;
}

body{
    text-align:center;
    overflow:hidden;
}

h1{
    margin:10px 0 3px;
    font-size:24px;
}

p{
    margin:0 0 8px;
    color:#aaa;
}

#table{
    position:relative;
    width:94vw;
    max-width:900px;
    aspect-ratio:2/1;
    margin:auto;

    background:#08733c;

    border:18px solid #5b321c;
    border-radius:12px;

    overflow:hidden;
    touch-action:none;
    user-select:none;
}


/* TRONERAS */

.pocket{
    position:absolute;
    width:7%;
    aspect-ratio:1;

    background:#050505;
    border-radius:50%;

    z-index:2;
}

.p1{left:-3.5%;top:-3.5%}
.p2{right:-3.5%;top:-3.5%}
.p3{left:-3.5%;bottom:-3.5%}
.p4{right:-3.5%;bottom:-3.5%}
.p5{left:46.5%;top:-5%}
.p6{left:46.5%;bottom:-5%}


/* BOLAS */

.ball{
    position:absolute;

    width:5%;
    aspect-ratio:1;

    border-radius:50%;

    transform:translate(-50%,-50%);

    pointer-events:none;

    z-index:10;
}

#cueBall{
    left:25%;
    top:50%;

    background:white;

    box-shadow:
    0 2px 5px rgba(0,0,0,.5);
}

#target{
    left:70%;
    top:50%;

    background:#e63946;
}


/* LÍNEAS */

.trajectory{
    position:absolute;

    height:3px;

    background:white;

    transform-origin:0 50%;

    z-index:6;

    pointer-events:none;
}


/* LÍNEA DE CONTACTO */

.contactLine{
    position:absolute;

    height:3px;

    background:#ffd166;

    transform-origin:0 50%;

    z-index:7;

    pointer-events:none;
}


/* PUNTO DE CONTACTO */

.contactPoint{
    position:absolute;

    width:10px;
    height:10px;

    background:#ffd166;

    border-radius:50%;

    transform:translate(-50%,-50%);

    z-index:9;

    pointer-events:none;

    box-shadow:
    0 0 6px #ffd166;
}


/* REBOTES */

.bounce{
    position:absolute;

    width:9px;
    height:9px;

    background:#64d8ff;

    border-radius:50%;

    transform:translate(-50%,-50%);

    z-index:8;

    pointer-events:none;
}


/* ZONA TÁCTIL */

#touchArea{
    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:100%;

    z-index:20;

    background:transparent;

    touch-action:none;
}


/* ESTADO */

#status{
    margin:8px;

    color:#aaa;

    min-height:20px;
}


/* BOTÓN */

button{
    padding:10px 20px;

    border:0;

    border-radius:8px;

    font-weight:bold;

    font-size:14px;
}

</style>
</head>


<body>

<h1>🎱 Pool App</h1>

<p>
Mantén el dedo y muévelo para apuntar
</p>


<div id="table">

    <!-- TRONERAS -->

    <div class="pocket p1"></div>
    <div class="pocket p2"></div>
    <div class="pocket p3"></div>
    <div class="pocket p4"></div>
    <div class="pocket p5"></div>
    <div class="pocket p6"></div>


    <!-- BOLAS -->

    <div
    id="cueBall"
    class="ball">
    </div>


    <div
    id="target"
    class="ball">
    </div>


    <!-- CONTROL -->

    <div id="touchArea"></div>

</div>


<div id="status">
Listo
</div>


<button onclick="resetAim()">
Reiniciar
</button>


<script>


const table =
document.getElementById("table");

const touchArea =
document.getElementById("touchArea");

const status =
document.getElementById("status");


let active=false;


/* CREAR LÍNEA */

function createLine(
    className,
    x1,
    y1,
    x2,
    y2
){

    const line =
    document.createElement("div");

    line.className =
        className;


    const dx =
        x2-x1;

    const dy =
        y2-y1;


    const length =
        Math.sqrt(
            dx*dx+
            dy*dy
        );


    const angle =
        Math.atan2(
            dy,
            dx
        );


    line.style.left =
        x1+"px";

    line.style.top =
        y1+"px";

    line.style.width =
        length+"px";

    line.style.transform =
        "rotate("+
        angle+
        "rad)";


    table.appendChild(line);

}


/* CREAR PUNTO */

function createPoint(
    className,
    x,
    y
){

    const point =
    document.createElement("div");

    point.className =
        className;

    point.style.left =
        x+"px";

    point.style.top =
        y+"px";

    table.appendChild(point);

}


/* BORRAR LÍNEAS */

function clearAim(){

    document
    .querySelectorAll(
        ".trajectory,"+
        ".contactLine,"+
        ".contactPoint,"+
        ".bounce"
    )
    .forEach(
        element =>
        element.remove()
    );

}


/* TRAYECTORIA */

function drawTrajectory(angle){

    clearAim();


    const width =
        table.clientWidth;

    const height =
        table.clientHeight;


    const radius =
        width*0.025;


    /*
     * POSICIÓN DE LA BLANCA
     */

    const cueX =
        width*0.25;

    const cueY =
        height*0.50;


    /*
     * POSICIÓN DE LA OBJETIVO
     */

    const targetX =
        width*0.70;

    const targetY =
        height*0.50;


    /*
     * Dirección inicial
     */

    let dx =
        Math.cos(angle);

    let dy =
        Math.sin(angle);


    /*
     * DISTANCIA HASTA LA BOLA OBJETIVO
     */

    const toTargetX =
        targetX-cueX;

    const toTargetY =
        targetY-cueY;


    const targetDistance =
        Math.sqrt(
            toTargetX*toTargetX+
            toTargetY*toTargetY
        );


    /*
     * Punto de contacto
     *
     * La blanca impactaría
     * ligeramente antes del
     * centro de la bola roja.
     */

    const contactX =
        targetX-
        dx*radius*2;

    const contactY =
        targetY-
        dy*radius*2;


    /*
     * Línea principal
     */

    createLine(
        "trajectory",
        cueX,
        cueY,
        contactX,
        contactY
    );


    /*
     * Punto de contacto
     */

    createPoint(
        "contactPoint",
        contactX,
        contactY
    );


    /*
     * Línea que muestra
     * la dirección de salida
     * de la bola objetivo.
     */

    const normalX =
        targetX-contactX;

    const normalY =
        targetY-contactY;


    const normalLength =
        Math.sqrt(
            normalX*normalX+
            normalY*normalY
        );


    let outX =
        normalX/
        normalLength;

    let outY =
        normalY/
        normalLength;


    /*
     * Trayectoria posterior
     */

    const exitLength =
        Math.max(
            width,
            height
        )*2;


    const exitX =
        targetX+
        outX*exitLength;

    const exitY =
        targetY+
        outY*exitLength;


    createLine(
        "contactLine",
        targetX,
        targetY,
        exitX,
        exitY
    );


    /*
     * Ahora calculamos
     * algunos rebotes de la
     * trayectoria posterior.
     */

    let x =
        targetX;

    let y =
        targetY;

    let vx =
        outX;

    let vy =
        outY;


    const left =
        radius;

    const right =
        width-radius;

    const top =
        radius;

    const bottom =
        height-radius;


    let remaining =
        Math.max(
            width,
            height
        )*5;


    let bounceCount=0;


    while(
        remaining>0 &&
        bounceCount<5
    ){

        let tx=Infinity;
        let ty=Infinity;


        if(vx>0){

            tx =
            (right-x)/vx;

        }
        else if(vx<0){

            tx =
            (left-x)/vx;

        }


        if(vy>0){

            ty =
            (bottom-y)/vy;

        }
        else if(vy<0){

            ty =
            (top-y)/vy;

        }


        const distance =
        Math.min(
            tx,
            ty
        );


        if(
            distance>=remaining
        ){

            break;

        }


        const hitX =
        x+
        vx*distance;

        const hitY =
        y+
        vy*distance;


        createPoint(
            "bounce",
            hitX,
            hitY
        );


        if(
            Math.abs(
                distance-tx
            ) <
            Math.abs(
                distance-ty
            )
        ){

            vx=-vx;

        }
        else{

            vy=-vy;

        }


        x =
        hitX+
        vx*0.5;

        y =
        hitY+
        vy*0.5;


        remaining -=
        distance;


        bounceCount++;

    }

}


/* ACTUALIZAR APUNTADO */

function updateAim(
    clientX,
    clientY
){

    const rect =
    table.getBoundingClientRect();


    const ballX =
    rect.left+
    rect.width*0.25;


    const ballY =
    rect.top+
    rect.height*0.50;


    const dx =
    clientX-ballX;

    const dy =
    clientY-ballY;


    const angle =
    Math.atan2(
        dy,
        dx
    );


    drawTrajectory(angle);


    status.textContent =
    "Apuntando • "+
    Math.round(
        angle*180/Math.PI
    )+
    "°";

}


/* TOUCH START */

touchArea.addEventListener(
"touchstart",
function(e){

    e.preventDefault();

    active=true;

    const t =
    e.touches[0];

    updateAim(
        t.clientX,
        t.clientY
    );

},
{
    passive:false
}
);


/* TOUCH MOVE */

touchArea.addEventListener(
"touchmove",
function(e){

    e.preventDefault();

    if(!active)
        return;

    const t =
    e.touches[0];

    updateAim(
        t.clientX,
        t.clientY
    );

},
{
    passive:false
}
);


/* TOUCH END */

touchArea.addEventListener(
"touchend",
function(e){

    e.preventDefault();

    active=false;

    status.textContent =
    "Listo";

},
{
    passive:false
});


/* CANCELAR */

touchArea.addEventListener(
"touchcancel",
function(){

    active=false;

});


/* REINICIAR */

function resetAim(){

    clearAim();

    drawTrajectory(0);

    status.textContent =
    "Listo";

}


/* INICIO */

drawTrajectory(0);

</script>

</body>
</html>

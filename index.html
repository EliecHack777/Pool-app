<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pool App</title>

<style>
* {
  box-sizing: border-box;
  touch-action: none;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  margin: 16px 0 5px;
}

p {
  color: #aaa;
  margin-top: 0;
}

#table {
  position: relative;
  width: 94vw;
  max-width: 900px;
  aspect-ratio: 2 / 1;
  margin: 15px auto;
  background: #08733c;
  border: 18px solid #5b321c;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 0 25px #000;
}

.pocket {
  position: absolute;
  width: 7%;
  aspect-ratio: 1;
  background: #050505;
  border-radius: 50%;
}

.p1 { left: -3.5%; top: -3.5%; }
.p2 { right: -3.5%; top: -3.5%; }
.p3 { left: -3.5%; bottom: -3.5%; }
.p4 { right: -3.5%; bottom: -3.5%; }
.p5 { left: 46.5%; top: -5%; }
.p6 { left: 46.5%; bottom: -5%; }

#cueBall,
#target {
  position: absolute;
  width: 5%;
  aspect-ratio: 1;
  border-radius: 50%;
  transform: translate(-50%, -50%);
}

#cueBall {
  left: 25%;
  top: 50%;
  background: white;
  box-shadow: 0 2px 6px #222;
}

#target {
  left: 70%;
  top: 50%;
  background: #e63946;
}

#aimLine {
  position: absolute;
  height: 3px;
  background: white;
  transform-origin: left center;
  left: 25%;
  top: 50%;
  width: 45%;
  pointer-events: none;
}

.controls {
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
  margin: 15px;
}

button {
  padding: 12px 18px;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  font-size: 15px;
}

#info {
  color: #aaa;
  margin-bottom: 15px;
}
</style>
</head>

<body>

<h1>🎱 Pool App</h1>
<p>Toca y arrastra para apuntar</p>

<div id="table">

  <div class="pocket p1"></div>
  <div class="pocket p2"></div>
  <div class="pocket p3"></div>
  <div class="pocket p4"></div>
  <div class="pocket p5"></div>
  <div class="pocket p6"></div>

  <div id="cueBall"></div>
  <div id="target"></div>
  <div id="aimLine"></div>

</div>

<div class="controls">
  <button onclick="extendLine()">Extender línea</button>
  <button onclick="resetLine()">Reiniciar</button>
</div>

<div id="info">
  Longitud: <span id="length">45%</span>
</div>

<script>

const table = document.getElementById("table");
const line = document.getElementById("aimLine");
const lengthText = document.getElementById("length");

let lineLength = 45;

const ballX = 0.25;
const ballY = 0.50;

function updateAim(clientX, clientY) {

  const rect = table.getBoundingClientRect();

  const x = clientX - rect.left;
  const y = clientY - rect.top;

  const startX = rect.width * ballX;
  const startY = rect.height * ballY;

  const dx = x - startX;
  const dy = y - startY;

  const angle = Math.atan2(dy, dx);
  const distance = Math.sqrt(dx * dx + dy * dy);

  line.style.transform =
    "rotate(" + angle + "rad)";

  line.style.width =
    Math.max(distance, 40) + "px";
}

table.addEventListener("pointerdown", function(e) {
  updateAim(e.clientX, e.clientY);
});

table.addEventListener("pointermove", function(e) {
  if (e.buttons) {
    updateAim(e.clientX, e.clientY);
  }
});

function extendLine() {

  lineLength += 10;

  if (lineLength > 100) {
    lineLength = 100;
  }

  line.style.width =
    lineLength + "%";

  lengthText.textContent =
    lineLength + "%";
}

function resetLine() {

  lineLength = 45;

  line.style.width =
    lineLength + "%";

  line.style.transform =
    "rotate(0rad)";

  lengthText.textContent =
    lineLength + "%";
}

</script>

</body>
</html>

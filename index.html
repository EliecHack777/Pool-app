<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Pool App</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
  touch-action: none;
}

body {
  text-align: center;
}

h1 {
  margin: 12px 0 4px;
}

p {
  margin: 0 0 10px;
  color: #aaa;
}

#table {
  position: relative;
  width: 94vw;
  max-width: 900px;
  aspect-ratio: 2 / 1;
  margin: auto;
  background: #08733c;
  border: 18px solid #5b321c;
  border-radius: 12px;
  overflow: hidden;
  touch-action: none;
  user-select: none;
}

.pocket {
  position: absolute;
  width: 7%;
  aspect-ratio: 1;
  background: #050505;
  border-radius: 50%;
}

.p1 { left: -3.5%; top: -3.5%; }
.p2 { right: -3.5%; top: -3.5%; }
.p3 { left: -3.5%; bottom: -3.5%; }
.p4 { right: -3.5%; bottom: -3.5%; }
.p5 { left: 46.5%; top: -5%; }
.p6 { left: 46.5%; bottom: -5%; }

#cueBall,
#target {
  position: absolute;
  width: 5%;
  aspect-ratio: 1;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
}

#cueBall {
  left: 25%;
  top: 50%;
  background: white;
  box-shadow: 0 2px 5px #222;
}

#target {
  left: 70%;
  top: 50%;
  background: #e63946;
}

#aimLine {
  position: absolute;
  left: 25%;
  top: 50%;
  width: 700px;
  height: 4px;
  background: white;
  transform-origin: 0 50%;
  pointer-events: none;
}

#status {
  margin: 12px;
  color: #aaa;
}

button {
  padding: 11px 18px;
  border: 0;
  border-radius: 8px;
  font-weight: bold;
}
</style>
</head>

<body>

<h1>🎱 Pool App</h1>
<p>Mantén el dedo sobre la mesa y muévelo para apuntar</p>

<div id="table">

  <div class="pocket p1"></div>
  <div class="pocket p2"></div>
  <div class="pocket p3"></div>
  <div class="pocket p4"></div>
  <div class="pocket p5"></div>
  <div class="pocket p6"></div>

  <div id="aimLine"></div>

  <div id="cueBall"></div>
  <div id="target"></div>

</div>

<div id="status">Listo</div>

<button onclick="resetAim()">Reiniciar</button>

<script>

const table = document.getElementById("table");
const line = document.getElementById("aimLine");
const statusText = document.getElementById("status");

let touching = false;

function updateAim(clientX, clientY) {

    const rect = table.getBoundingClientRect();

    const startX = rect.left + rect.width * 0.25;
    const startY = rect.top + rect.height * 0.50;

    const dx = clientX - startX;
    const dy = clientY - startY;

    const angle = Math.atan2(dy, dx);

    line.style.transform =
        "rotate(" + angle + "rad)";

    statusText.textContent =
        "Apuntando • " + Math.round(angle * 180 / Math.PI) + "°";
}


/* TOQUE */

table.addEventListener("touchstart", function(event) {

    event.preventDefault();

    touching = true;

    const touch = event.touches[0];

    updateAim(touch.clientX, touch.clientY);

}, { passive: false });


/* MOVIMIENTO CONTINUO */

table.addEventListener("touchmove", function(event) {

    event.preventDefault();

    if (!touching) return;

    const touch = event.touches[0];

    updateAim(touch.clientX, touch.clientY);

}, { passive: false });


/* SOLTAR */

table.addEventListener("touchend", function(event) {

    event.preventDefault();

    touching = false;

    statusText.textContent = "Listo";

}, { passive: false });


table.addEventListener("touchcancel", function() {

    touching = false;

});


function resetAim() {

    line.style.transform = "rotate(0rad)";

    statusText.textContent = "Listo";

}

</script>

</body>
</html>

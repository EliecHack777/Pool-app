<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Pool App</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  overflow: hidden;
}

h1 {
  margin: 12px 0 4px;
}

p {
  margin: 0 0 10px;
  color: #aaa;
}

#table {
  position: relative;
  width: 94vw;
  max-width: 900px;
  aspect-ratio: 2 / 1;
  margin: auto;
  background: #08733c;
  border: 18px solid #5b321c;
  border-radius: 12px;
  overflow: hidden;
}

.pocket {
  position: absolute;
  width: 7%;
  aspect-ratio: 1;
  background: #050505;
  border-radius: 50%;
}

.p1 { left: -3.5%; top: -3.5%; }
.p2 { right: -3.5%; top: -3.5%; }
.p3 { left: -3.5%; bottom: -3.5%; }
.p4 { right: -3.5%; bottom: -3.5%; }
.p5 { left: 46.5%; top: -5%; }
.p6 { left: 46.5%; bottom: -5%; }

.ball {
  position: absolute;
  width: 5%;
  aspect-ratio: 1;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  z-index: 5;
}

#cueBall {
  left: 25%;
  top: 50%;
  background: white;
}

#target {
  left: 70%;
  top: 50%;
  background: red;
}

#aimLine {
  position: absolute;
  height: 4px;
  width: 400px;
  background: white;
  left: 25%;
  top: 50%;
  transform-origin: 0 50%;
  pointer-events: none;
  z-index: 2;
}

.controls {
  margin-top: 12px;
}

button {
  padding: 12px 20px;
  border: 0;
  border-radius: 8px;
  font-weight: bold;
}
</style>
</head>

<body>

<h1>🎱 Pool App</h1>
<p>Arrastra el dedo para apuntar</p>

<div id="table">

  <div class="pocket p1"></div>
  <div class="pocket p2"></div>
  <div class="pocket p3"></div>
  <div class="pocket p4"></div>
  <div class="pocket p5"></div>
  <div class="pocket p6"></div>

  <div id="aimLine"></div>

  <div id="cueBall" class="ball"></div>
  <div id="target" class="ball"></div>

</div>

<div class="controls">
  <button onclick="resetAim()">Reiniciar línea</button>
</div>

<script>

const table = document.getElementById("table");
const line = document.getElementById("aimLine");

let dragging = false;

function aim(x, y) {

  const rect = table.getBoundingClientRect();

  const startX = rect.width * 0.25;
  const startY = rect.height * 0.50;

  const mouseX = x - rect.left;
  const mouseY = y - rect.top;

  const dx = mouseX - startX;
  const dy = mouseY - startY;

  const angle = Math.atan2(dy, dx);

  line.style.transform =
    "rotate(" + angle + "rad)";
}

table.addEventListener("pointerdown", function(event) {

  dragging = true;

  table.setPointerCapture(event.pointerId);

  aim(event.clientX, event.clientY);

});

table.addEventListener("pointermove", function(event) {

  if (!dragging) return;

  aim(event.clientX, event.clientY);

});

table.addEventListener("pointerup", function() {

  dragging = false;

});

table.addEventListener("pointercancel", function() {

  dragging = false;

});

function resetAim() {

  line.style.transform = "rotate(0rad)";

}

</script>

</body>
</html>

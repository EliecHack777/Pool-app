<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

<title>Pool App</title>

<style>

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    touch-action:none;
}

body{
    text-align:center;
    overflow:hidden;
}

h1{
    margin:10px 0 3px;
    font-size:24px;
}

p{
    margin:0 0 8px;
    color:#aaa;
}

#table{
    position:relative;

    width:94vw;
    max-width:900px;

    aspect-ratio:2/1;

    margin:auto;

    background:#08733c;

    border:18px solid #5b321c;
    border-radius:12px;

    overflow:hidden;

    touch-action:none;
    user-select:none;
}


/* TRONERAS */

.pocket{
    position:absolute;

    width:7%;
    aspect-ratio:1;

    background:#050505;

    border-radius:50%;

    z-index:2;
}

.p1{left:-3.5%;top:-3.5%}
.p2{right:-3.5%;top:-3.5%}
.p3{left:-3.5%;bottom:-3.5%}
.p4{right:-3.5%;bottom:-3.5%}
.p5{left:46.5%;top:-5%}
.p6{left:46.5%;bottom:-5%}


/* BOLAS */

.ball{
    position:absolute;

    width:5%;
    aspect-ratio:1;

    border-radius:50%;

    transform:translate(-50%,-50%);

    z-index:15;

    touch-action:none;
}

#cueBall{
    left:25%;
    top:50%;

    background:white;

    box-shadow:
    0 2px 5px rgba(0,0,0,.5);
}

#target{
    left:70%;
    top:50%;

    background:#e63946;
}


/* TRAYECTORIA */

.trajectory{
    position:absolute;

    height:3px;

    background:white;

    transform-origin:0 50%;

    z-index:6;

    pointer-events:none;
}


/* LÍNEA DE CONTACTO */

.contactLine{
    position:absolute;

    height:3px;

    background:#ffd166;

    transform-origin:0 50%;

    z-index:7;

    pointer-events:none;
}


/* PUNTO DE CONTACTO */

.contactPoint{
    position:absolute;

    width:10px;
    height:10px;

    background:#ffd166;

    border-radius:50%;

    transform:translate(-50%,-50%);

    z-index:9;

    pointer-events:none;
}


/* REBOTES */

.bounce{
    position:absolute;

    width:9px;
    height:9px;

    background:#64d8ff;

    border-radius:50%;

    transform:translate(-50%,-50%);

    z-index:8;

    pointer-events:none;
}


/* ZONA DE APUNTADO */

#aimArea{
    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:100%;

    z-index:5;

    background:transparent;

    touch-action:none;
}


/* ESTADO */

#status{
    margin:8px;

    color:#aaa;

    min-height:20px;
}


/* BOTONES */

.controls{
    display:flex;

    justify-content:center;

    gap:8px;
}

button{
    padding:10px 18px;

    border:0;

    border-radius:8px;

    font-weight:bold;
}

</style>

</head>


<body>

<h1>🎱 Pool App</h1>

<p>
Mueve las bolas o mantén el dedo para apuntar
</p>


<div id="table">


    <!-- TRONERAS -->

    <div class="pocket p1"></div>
    <div class="pocket p2"></div>
    <div class="pocket p3"></div>
    <div class="pocket p4"></div>
    <div class="pocket p5"></div>
    <div class="pocket p6"></div>


    <!-- TRAYECTORIA -->

    <div id="aimArea"></div>


    <!-- BOLAS -->

    <div
    id="cueBall"
    class="ball">
    </div>

    <div
    id="target"
    class="ball">
    </div>


</div>


<div id="status">
Listo
</div>


<div class="controls">

<button onclick="resetTable()">
Reiniciar
</button>

</div>


<script>


/* ELEMENTOS */

const table =
document.getElementById("table");

const aimArea =
document.getElementById("aimArea");

const cueBall =
document.getElementById("cueBall");

const target =
document.getElementById("target");

const status =
document.getElementById("status");


/*
 * Estado
 */

let mode="aim";

let draggingBall=null;


/*
 * Crear línea
 */

function createLine(
    className,
    x1,
    y1,
    x2,
    y2
){

    const line =
    document.createElement("div");

    line.className =
        className;


    const dx =
        x2-x1;

    const dy =
        y2-y1;


    const length =
        Math.sqrt(
            dx*dx+
            dy*dy
        );


    const angle =
        Math.atan2(
            dy,
            dx
        );


    line.style.left =
        x1+"px";

    line.style.top =
        y1+"px";

    line.style.width =
        length+"px";

    line.style.transform =
        "rotate("+
        angle+
        "rad)";


    table.appendChild(line);

}


/*
 * Crear punto
 */

function createPoint(
    className,
    x,
    y
){

    const point =
    document.createElement("div");

    point.className =
        className;

    point.style.left =
        x+"px";

    point.style.top =
        y+"px";


    table.appendChild(point);

}


/*
 * Limpiar
 */

function clearAim(){

    document
    .querySelectorAll(
        ".trajectory,"+
        ".contactLine,"+
        ".contactPoint,"+
        ".bounce"
    )
    .forEach(
        element =>
        element.remove()
    );

}


/*
 * Obtener posición de bola
 */

function getBallPosition(ball){

    const width =
        table.clientWidth;

    const height =
        table.clientHeight;


    const left =
        parseFloat(
            ball.style.left ||
            (
                ball.offsetLeft/
                width*100
            )+
            "%"
        );


    const top =
        parseFloat(
            ball.style.top ||
            (
                ball.offsetTop/
                height*100
            )+
            "%"
        );


    return {

        x:
        width*left/100,

        y:
        height*top/100

    };

}


/*
 * Calcular trayectoria
 */

function drawTrajectory(angle){

    clearAim();


    const width =
        table.clientWidth;

    const height =
        table.clientHeight;


    const radius =
        width*0.025;


    /*
     * POSICIONES
     */

    const cue =
        getBallPosition(
            cueBall
        );


    const targetPos =
        getBallPosition(
            target
        );


    /*
     * Dirección
     */

    let dx =
        Math.cos(angle);

    let dy =
        Math.sin(angle);


    /*
     * Vector hacia objetivo
     */

    const vx =
        targetPos.x-cue.x;

    const vy =
        targetPos.y-cue.y;


    const distance =
        Math.sqrt(
            vx*vx+
            vy*vy
        );


    /*
     * Punto de contacto
     */

    const contactX =
        targetPos.x-
        dx*radius*2;


    const contactY =
        targetPos.y-
        dy*radius*2;


    /*
     * Línea blanca
     */

    createLine(
        "trajectory",

        cue.x,
        cue.y,

        contactX,
        contactY
    );


    /*
     * Punto amarillo
     */

    createPoint(
        "contactPoint",

        contactX,
        contactY
    );


    /*
     * Dirección de salida
     *
     * Usamos la línea que une
     * los centros de las bolas.
     */

    let outX =
        targetPos.x-cue.x;

    let outY =
        targetPos.y-cue.y;


    const outLength =
        Math.sqrt(
            outX*outX+
            outY*outY
        );


    if(outLength>0){

        outX /=
            outLength;

        outY /=
            outLength;

    }


    /*
     * Trayectoria de salida
     */

    const exitLength =
        Math.max(
            width,
            height
        )*2;


    const exitX =
        targetPos.x+
        outX*exitLength;

    const exitY =
        targetPos.y+
        outY*exitLength;


    createLine(
        "contactLine",

        targetPos.x,
        targetPos.y,

        exitX,
        exitY
    );


    /*
     * Rebotes
     */

    let x =
        targetPos.x;

    let y =
        targetPos.y;

    let vx2 =
        outX;

    let vy2 =
        outY;


    const left =
        radius;

    const right =
        width-radius;

    const top =
        radius;

    const bottom =
        height-radius;


    let remaining =
        Math.max(
            width,
            height
        )*5;


    let bounces=0;


    while(
        remaining>0 &&
        bounces<6
    ){

        let tx=Infinity;
        let ty=Infinity;


        if(vx2>0){

            tx =
            (right-x)/vx2;

        }else if(vx2<0){

            tx =
            (left-x)/vx2;

        }


        if(vy2>0){

            ty =
            (bottom-y)/vy2;

        }else if(vy2<0){

            ty =
            (top-y)/vy2;

        }


        const hit =
        Math.min(
            tx,
            ty
        );


        if(hit>=remaining)
            break;


        const hitX =
        x+
        vx2*hit;

        const hitY =
        y+
        vy2*hit;


        createPoint(
            "bounce",
            hitX,
            hitY
        );


        if(
            Math.abs(hit-tx)<
            Math.abs(hit-ty)
        ){

            vx2=-vx2;

        }else{

            vy2=-vy2;

        }


        x =
        hitX+
        vx2*0.5;

        y =
        hitY+
        vy2*0.5;


        remaining-=hit;

        bounces++;

    }

}


/*
 * Apuntar
 */

function aimAt(
    clientX,
    clientY
){

    const rect =
        table.getBoundingClientRect();


    const ball =
        getBallPosition(
            cueBall
        );


    const ballX =
        rect.left+
        ball.x;


    const ballY =
        rect.top+
        ball.y;


    const dx =
        clientX-ballX;

    const dy =
        clientY-ballY;


    const angle =
        Math.atan2(
            dy,
            dx
        );


    drawTrajectory(angle);


    status.textContent =
        "Apuntando";

}


/*
 * Comenzar a mover bola
 */

function startDrag(
    ball,
    event
){

    event.preventDefault();

    draggingBall=ball;

}


/*
 * Movimiento de bola
 */

function moveBall(
    event
){

    if(!draggingBall)
        return;


    event.preventDefault();


    const touch =
        event.touches[0];


    const rect =
        table.getBoundingClientRect();


    let x =
        (
            touch.clientX-
            rect.left
        )/
        rect.width*
        100;


    let y =
        (
            touch.clientY-
            rect.top
        )/
        rect.height*
        100;


    /*
     * Limitar dentro de la mesa
     */

    x =
        Math.max(
            5,
            Math.min(
                95,
                x
            )
        );


    y =
        Math.max(
            5,
            Math.min(
                95,
                y
            )
        );


    draggingBall.style.left =
        x+"%";


    draggingBall.style.top =
        y+"%";


    status.textContent =
        "Moviendo bola";


    /*
     * Redibujar automáticamente
     */

    const cue =
        getBallPosition(
            cueBall
        );

    const targetPos =
        getBallPosition(
            target
        );


    const dx =
        targetPos.x-cue.x;

    const dy =
        targetPos.y-cue.y;


    drawTrajectory(
        Math.atan2(
            dy,
            dx
        )
    );

}


/*
 * Soltar bola
 */

function endDrag(){

    draggingBall=null;

    status.textContent =
        "Listo";

}


/*
 * Eventos de bolas
 */

cueBall.addEventListener(
"touchstart",
function(e){

    startDrag(
        cueBall,
        e
    );

},
{
    passive:false
});


target.addEventListener(
"touchstart",
function(e){

    startDrag(
        target,
        e
    );

},
{
    passive:false
});


/*
 * Movimiento global
 */

document.addEventListener(
"touchmove",
function(e){

    if(draggingBall){

        moveBall(e);

    }

},
{
    passive:false
});


document.addEventListener(
"touchend",
function(){

    endDrag();

});


/*
 * Apuntado
 */

aimArea.addEventListener(
"touchstart",
function(e){

    if(draggingBall)
        return;


    e.preventDefault();

    const t =
        e.touches[0];


    aimAt(
        t.clientX,
        t.clientY
    );

},
{
    passive:false
});


aimArea.addEventListener(
"touchmove",
function(e){

    if(draggingBall)
        return;


    e.preventDefault();

    const t =
        e.touches[0];


    aimAt(
        t.clientX,
        t.clientY
    );

},
{
    passive:false
});


/*
 * Reiniciar
 */

function resetTable(){

    cueBall.style.left="25%";
    cueBall.style.top="50%";

    target.style.left="70%";
    target.style.top="50%";


    const angle=0;

    drawTrajectory(angle);


    status.textContent =
        "Listo";

}


/*
 * Inicio
 */

resetTable();

</script>

</body>
</html>

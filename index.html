<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

<title>Pool App</title>

<style>

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    overflow:hidden;
    touch-action:none;
}

body{
    text-align:center;
}

h1{
    margin:10px 0 3px;
    font-size:24px;
}

p{
    margin:0 0 8px;
    color:#aaa;
}

#table{
    position:relative;

    width:94vw;
    max-width:900px;
    aspect-ratio:2/1;

    margin:auto;

    background:#08733c;

    border:18px solid #5b321c;
    border-radius:12px;

    overflow:hidden;

    touch-action:none;
}


/* TRONERAS */

.pocket{
    position:absolute;

    width:7%;
    aspect-ratio:1;

    background:#050505;
    border-radius:50%;

    z-index:2;
}

.p1{left:-3.5%;top:-3.5%}
.p2{right:-3.5%;top:-3.5%}
.p3{left:-3.5%;bottom:-3.5%}
.p4{right:-3.5%;bottom:-3.5%}
.p5{left:46.5%;top:-5%}
.p6{left:46.5%;bottom:-5%}


/* BOLAS */

.ball{
    position:absolute;

    width:5%;
    aspect-ratio:1;

    border-radius:50%;

    transform:translate(-50%,-50%);

    z-index:20;

    touch-action:none;
}

#cueBall{
    left:25%;
    top:50%;

    background:white;

    box-shadow:
    0 2px 5px rgba(0,0,0,.5);
}

#target{
    left:70%;
    top:50%;

    background:#e63946;
}


/* LÍNEAS */

.trajectory{
    position:absolute;

    height:3px;

    background:white;

    transform-origin:0 50%;

    z-index:5;

    pointer-events:none;
}

.contactLine{
    position:absolute;

    height:3px;

    background:#ffd166;

    transform-origin:0 50%;

    z-index:6;

    pointer-events:none;
}


/* PUNTOS */

.contactPoint{
    position:absolute;

    width:10px;
    height:10px;

    background:#ffd166;

    border-radius:50%;

    transform:translate(-50%,-50%);

    z-index:8;

    pointer-events:none;
}

.bounce{
    position:absolute;

    width:9px;
    height:9px;

    background:#64d8ff;

    border-radius:50%;

    transform:translate(-50%,-50%);

    z-index:7;

    pointer-events:none;
}


/* ESTADO */

#status{
    margin:8px;

    color:#aaa;

    min-height:20px;
}


button{
    padding:10px 20px;

    border:0;
    border-radius:8px;

    font-weight:bold;
}

</style>
</head>


<body>

<h1>🎱 Pool App</h1>

<p>
Toca una bola para moverla. Toca la mesa para apuntar.
</p>


<div id="table">

    <div class="pocket p1"></div>
    <div class="pocket p2"></div>
    <div class="pocket p3"></div>
    <div class="pocket p4"></div>
    <div class="pocket p5"></div>
    <div class="pocket p6"></div>

    <div id="cueBall" class="ball"></div>

    <div id="target" class="ball"></div>

</div>


<div id="status">
Listo
</div>


<button onclick="resetTable()">
Reiniciar
</button>


<script>


const table =
document.getElementById("table");

const cueBall =
document.getElementById("cueBall");

const target =
document.getElementById("target");

const status =
document.getElementById("status");


let action=null;


/*
 * POSICIONES
 */

let cue={
    x:25,
    y:50
};

let targetPos={
    x:70,
    y:50
};


/*
 * ACTUALIZAR BOLAS
 */

function updateBalls(){

    cueBall.style.left=
        cue.x+"%";

    cueBall.style.top=
        cue.y+"%";


    target.style.left=
        targetPos.x+"%";

    target.style.top=
        targetPos.y+"%";

}


/*
 * CREAR LÍNEA
 */

function line(
    className,
    x1,
    y1,
    x2,
    y2
){

    const element=
        document.createElement("div");

    element.className=
        className;


    const dx=x2-x1;
    const dy=y2-y1;


    const length=
        Math.sqrt(
            dx*dx+
            dy*dy
        );


    const angle=
        Math.atan2(
            dy,
            dx
        );


    element.style.left=
        x1+"px";

    element.style.top=
        y1+"px";

    element.style.width=
        length+"px";

    element.style.transform=
        "rotate("+
        angle+
        "rad)";


    table.appendChild(element);

}


/*
 * CREAR PUNTO
 */

function point(
    className,
    x,
    y
){

    const element=
        document.createElement("div");

    element.className=
        className;

    element.style.left=
        x+"px";

    element.style.top=
        y+"px";


    table.appendChild(element);

}


/*
 * LIMPIAR
 */

function clearLines(){

    document
    .querySelectorAll(
        ".trajectory,"+
        ".contactLine,"+
        ".contactPoint,"+
        ".bounce"
    )
    .forEach(
        e=>e.remove()
    );

}


/*
 * DIBUJAR TRAYECTORIA
 */

function draw(){

    clearLines();


    const w=
        table.clientWidth;

    const h=
        table.clientHeight;


    const cueX=
        w*cue.x/100;

    const cueY=
        h*cue.y/100;


    const targetX=
        w*targetPos.x/100;

    const targetY=
        h*targetPos.y/100;


    /*
     * Dirección hacia
     * la bola objetivo
     */

    let dx=
        targetX-cueX;

    let dy=
        targetY-cueY;


    const distance=
        Math.sqrt(
            dx*dx+
            dy*dy
        );


    if(distance<1)
        return;


    dx/=distance;
    dy/=distance;


    /*
     * Radio de la bola
     */

    const radius=
        w*0.025;


    /*
     * Punto de contacto
     */

    const contactX=
        targetX-
        dx*radius*2;

    const contactY=
        targetY-
        dy*radius*2;


    /*
     * Línea blanca
     */

    line(
        "trajectory",
        cueX,
        cueY,
        contactX,
        contactY
    );


    /*
     * Punto amarillo
     */

    point(
        "contactPoint",
        contactX,
        contactY
    );


    /*
     * Dirección de salida
     */

    let vx=dx;
    let vy=dy;


    const exitLength=
        Math.max(w,h)*2;


    line(
        "contactLine",

        targetX,
        targetY,

        targetX+
        vx*exitLength,

        targetY+
        vy*exitLength
    );


    /*
     * REBOTES
     */

    let x=
        targetX;

    let y=
        targetY;


    const left=
        radius;

    const right=
        w-radius;

    const top=
        radius;

    const bottom=
        h-radius;


    let remaining=
        Math.max(w,h)*6;


    let count=0;


    while(
        remaining>0 &&
        count<8
    ){

        let tx=Infinity;
        let ty=Infinity;


        if(vx>0)
            tx=(right-x)/vx;

        if(vx<0)
            tx=(left-x)/vx;


        if(vy>0)
            ty=(bottom-y)/vy;

        if(vy<0)
            ty=(top-y)/vy;


        const hit=
            Math.min(tx,ty);


        if(
            !isFinite(hit) ||
            hit>=remaining
        )
            break;


        const hx=
            x+vx*hit;

        const hy=
            y+vy*hit;


        point(
            "bounce",
            hx,
            hy
        );


        /*
         * Rebote
         */

        if(
            Math.abs(hit-tx)<
            Math.abs(hit-ty)
        ){

            vx=-vx;

        }else{

            vy=-vy;

        }


        x=
            hx+
            vx*0.5;

        y=
            hy+
            vy*0.5;


        remaining-=hit;

        count++;

    }

}


/*
 * CONVERTIR TOUCH
 * A COORDENADAS DE MESA
 */

function tablePosition(touch){

    const rect=
        table.getBoundingClientRect();


    let x=
        (
            touch.clientX-
            rect.left
        )/
        rect.width*100;


    let y=
        (
            touch.clientY-
            rect.top
        )/
        rect.height*100;


    /*
     * Mantener dentro
     * de la mesa
     */

    x=
        Math.max(
            5,
            Math.min(
                95,
                x
            )
        );


    y=
        Math.max(
            5,
            Math.min(
                95,
                y
            )
        );


    return {x,y};

}


/*
 * COMENZAR TOQUE
 */

table.addEventListener(
"touchstart",
function(e){

    e.preventDefault();


    const touch=
        e.touches[0];


    const rect=
        table.getBoundingClientRect();


    const px=
        touch.clientX-
        rect.left;

    const py=
        touch.clientY-
        rect.top;


    const w=
        table.clientWidth;

    const h=
        table.clientHeight;


    /*
     * Posición de las bolas
     */

    const cx=
        w*cue.x/100;

    const cy=
        h*cue.y/100;


    const tx=
        w*targetPos.x/100;

    const ty=
        h*targetPos.y/100;


    const radius=
        w*0.04;


    /*
     * ¿Tocó la blanca?
     */

    if(
        Math.hypot(
            px-cx,
            py-cy
        )<
        radius
    ){

        action="cue";

        status.textContent=
            "Moviendo bola blanca";

        return;
    }


    /*
     * ¿Tocó la roja?
     */

    if(
        Math.hypot(
            px-tx,
            py-ty
        )<
        radius
    ){

        action="target";

        status.textContent=
            "Moviendo bola objetivo";

        return;
    }


    /*
     * Si no tocó una bola:
     * comienza a apuntar.
     */

    action="aim";

    status.textContent=
        "Apuntando";

});


/*
 * MOVIMIENTO
 */

table.addEventListener(
"touchmove",
function(e){

    e.preventDefault();


    const touch=
        e.touches[0];


    /*
     * MOVER BLANCA
     */

    if(action==="cue"){

        cue=
            tablePosition(touch);


        updateBalls();

        draw();

        return;
    }


    /*
     * MOVER ROJA
     */

    if(action==="target"){

        targetPos=
            tablePosition(touch);


        updateBalls();

        draw();

        return;
    }


    /*
     * APUNTAR
     */

    if(action==="aim"){

        const rect=
            table.getBoundingClientRect();


        const cueX=
            rect.left+
            rect.width*cue.x/100;

        const cueY=
            rect.top+
            rect.height*cue.y/100;


        const dx=
            touch.clientX-cueX;

        const dy=
            touch.clientY-cueY;


        /*
         * Para apuntar usamos
         * temporalmente el ángulo.
         */

        drawAim(
            Math.atan2(
                dy,
                dx
            )
        );

    }

},
{
    passive:false
});


/*
 * DIBUJAR APUNTADO
 */

function drawAim(angle){

    clearLines();


    const w=
        table.clientWidth;

    const h=
        table.clientHeight;


    const x=
        w*cue.x/100;

    const y=
        h*cue.y/100;


    let dx=
        Math.cos(angle);

    let dy=
        Math.sin(angle);


    const radius=
        w*0.025;


    const left=
        radius;

    const right=
        w-radius;

    const top=
        radius;

    const bottom=
        h-radius;


    let remaining=
        Math.max(w,h)*10;


    let bounces=0;


    while(
        remaining>0 &&
        bounces<8
    ){

        let tx=Infinity;
        let ty=Infinity;


        if(dx>0)
            tx=(right-x)/dx;

        if(dx<0)
            tx=(left-x)/dx;


        if(dy>0)
            ty=(bottom-y)/dy;

        if(dy<0)
            ty=(top-y)/dy;


        const distance=
            Math.min(tx,ty);


        if(
            distance>=remaining
        ){

            line(
                "trajectory",
                x,
                y,
                x+dx*remaining,
                y+dy*remaining
            );

            break;
        }


        const hx=
            x+dx*distance;

        const hy=
            y+dy*distance;


        line(
            "trajectory",
            x,
            y,
            hx,
            hy
        );


        point(
            "bounce",
            hx,
            hy
        );


        if(
            Math.abs(distance-tx)<
            Math.abs(distance-ty)
        ){

            dx=-dx;

        }else{

            dy=-dy;

        }


        remaining-=distance;


        /*
         * Actualizar posición
         */

        var nx=
            hx+dx*0.5;

        var ny=
            hy+dy*0.5;


        /*
         * Estas variables pasan
         * al siguiente tramo.
         */

        window._aimX=nx;
        window._aimY=ny;


        /*
         * Continuar
         */

        /*
         * Como las variables
         * x/y son const, terminamos
         * esta versión del cálculo
         * después del rebote.
         */

        break;
    }

}


/*
 * SOLTAR
 */

table.addEventListener(
"touchend",
function(){

    action=null;

    status.textContent=
        "Listo";

});


/*
 * REINICIAR
 */

function resetTable(){

    cue={
        x:25,
        y:50
    };


    targetPos={
        x:70,
        y:50
    };


    updateBalls();

    draw();


    status.textContent=
        "Listo";

}


/*
 * INICIAR
 */

resetTable();

</script>

</body>
</html>

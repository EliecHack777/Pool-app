<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

<title>Pool App</title>

<style>

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    touch-action:none;
}

body{
    text-align:center;
    overflow:hidden;
}

h1{
    margin:10px 0 3px;
}

p{
    margin:0 0 8px;
    color:#aaa;
}

#table{
    position:relative;

    width:94vw;
    max-width:900px;

    aspect-ratio:2/1;

    margin:auto;

    background:#08733c;

    border:18px solid #5b321c;

    border-radius:12px;

    overflow:hidden;

    touch-action:none;
}


/* TRONERAS */

.pocket{
    position:absolute;

    width:7%;
    aspect-ratio:1;

    background:#050505;

    border-radius:50%;

    z-index:2;
}

.p1{left:-3.5%;top:-3.5%}
.p2{right:-3.5%;top:-3.5%}
.p3{left:-3.5%;bottom:-3.5%}
.p4{right:-3.5%;bottom:-3.5%}
.p5{left:46.5%;top:-5%}
.p6{left:46.5%;bottom:-5%}


/* BOLA BLANCA */

#cueBall{
    position:absolute;

    width:5%;
    aspect-ratio:1;

    left:25%;
    top:50%;

    transform:translate(-50%,-50%);

    background:white;

    border-radius:50%;

    z-index:10;

    pointer-events:none;
}


/* BOLA ROJA */

#target{
    position:absolute;

    width:5%;
    aspect-ratio:1;

    left:70%;
    top:50%;

    transform:translate(-50%,-50%);

    background:#e63946;

    border-radius:50%;

    z-index:10;

    pointer-events:none;
}


/* LÍNEAS */

.trajectory{
    position:absolute;

    height:4px;

    background:white;

    transform-origin:0 50%;

    z-index:6;

    pointer-events:none;

    box-shadow:
    0 0 3px rgba(255,255,255,.8);
}


/* PUNTOS DE REBOTE */

.bounce{
    position:absolute;

    width:10px;
    height:10px;

    background:#ffd166;

    border-radius:50%;

    transform:translate(-50%,-50%);

    z-index:8;

    pointer-events:none;
}


/* ZONA TÁCTIL */

#touchArea{
    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:100%;

    z-index:20;

    background:transparent;

    touch-action:none;
}


/* TEXTO */

#status{
    margin:8px;

    color:#aaa;

    min-height:20px;
}


button{
    padding:10px 20px;

    border:0;

    border-radius:8px;

    font-weight:bold;
}

</style>
</head>


<body>

<h1>🎱 Pool App</h1>

<p>
Mantén el dedo y muévelo para apuntar
</p>


<div id="table">


    <div class="pocket p1"></div>
    <div class="pocket p2"></div>
    <div class="pocket p3"></div>
    <div class="pocket p4"></div>
    <div class="pocket p5"></div>
    <div class="pocket p6"></div>


    <div id="cueBall"></div>

    <div id="target"></div>


    <div id="touchArea"></div>

</div>


<div id="status">
Listo
</div>


<button onclick="resetAim()">
Reiniciar
</button>


<script>

const table =
document.getElementById("table");

const touchArea =
document.getElementById("touchArea");

const status =
document.getElementById("status");


let active=false;


/*
 * Crear una línea entre dos puntos
 */

function createLine(
    x1,
    y1,
    x2,
    y2
){

    const line =
    document.createElement("div");

    line.className="trajectory";


    const dx=x2-x1;
    const dy=y2-y1;


    const length =
    Math.sqrt(
        dx*dx+
        dy*dy
    );


    const angle =
    Math.atan2(
        dy,
        dx
    );


    line.style.left=x1+"px";
    line.style.top=y1+"px";

    line.style.width=length+"px";

    line.style.transform=
        "rotate("+
        angle+
        "rad)";


    table.appendChild(line);
}


/*
 * Crear punto de rebote
 */

function createBounce(x,y){

    const point =
    document.createElement("div");

    point.className="bounce";

    point.style.left=x+"px";
    point.style.top=y+"px";

    table.appendChild(point);
}


/*
 * Borrar trayectoria anterior
 */

function clearTrajectory(){

    document
    .querySelectorAll(
        ".trajectory,.bounce"
    )
    .forEach(
        element=>element.remove()
    );

}


/*
 * CALCULAR REBOTES
 */

function drawTrajectory(angle){

    clearTrajectory();


    const width =
    table.clientWidth;

    const height =
    table.clientHeight;


    /*
     * Bola blanca
     */

    let x =
    width*0.25;

    let y =
    height*0.50;


    /*
     * Dirección
     */

    let dx =
    Math.cos(angle);

    let dy =
    Math.sin(angle);


    /*
     * Distancia máxima
     */

    let remaining =
    Math.max(
        width,
        height
    )*10;


    /*
     * Máximo 8 rebotes
     */

    let bounceCount=0;


    while(
        remaining>0 &&
        bounceCount<8
    ){

        let tx=Infinity;
        let ty=Infinity;


        /*
         * Banda derecha/izquierda
         */

        if(dx>0){

            tx=
            (width-x)/dx;

        }else if(dx<0){

            tx=
            (0-x)/dx;
        }


        /*
         * Banda inferior/superior
         */

        if(dy>0){

            ty=
            (height-y)/dy;

        }else if(dy<0){

            ty=
            (0-y)/dy;
        }


        /*
         * Próxima banda
         */

        const distance =
        Math.min(
            tx,
            ty
        );


        /*
         * No llega a otra banda
         */

        if(
            distance>=remaining
        ){

            const endX =
            x+
            dx*remaining;

            const endY =
            y+
            dy*remaining;


            createLine(
                x,
                y,
                endX,
                endY
            );


            break;
        }


        /*
         * Punto donde golpea
         * la banda
         */

        const hitX =
        x+
        dx*distance;

        const hitY =
        y+
        dy*distance;


        /*
         * Dibujar tramo
         */

        createLine(
            x,
            y,
            hitX,
            hitY
        );


        /*
         * Marcar rebote
         */

        createBounce(
            hitX,
            hitY
        );


        /*
         * Saber qué banda golpeó
         */

        if(
            Math.abs(
                distance-tx
            ) <
            0.001
        ){

            /*
             * Banda izquierda/derecha
             */

            dx=-dx;

        }else{

            /*
             * Banda superior/inferior
             */

            dy=-dy;
        }


        /*
         * Continuar un poquito
         * después del rebote
         */

        x=
        hitX+
        dx*0.5;

        y=
        hitY+
        dy*0.5;


        remaining -=
        distance;


        bounceCount++;
    }

}


/*
 * ACTUALIZAR DIRECCIÓN
 */

function updateAim(
    clientX,
    clientY
){

    const rect =
    table.getBoundingClientRect();


    const ballX =
    rect.left+
    rect.width*0.25;


    const ballY =
    rect.top+
    rect.height*0.50;


    const dx =
    clientX-ballX;


    const dy =
    clientY-ballY;


    const angle =
    Math.atan2(
        dy,
        dx
    );


    drawTrajectory(angle);


    status.textContent=
        "Apuntando • "+
        Math.round(
            angle*180/Math.PI
        )+
        "°";
}


/*
 * TOUCH START
 */

touchArea.addEventListener(
"touchstart",
function(e){

    e.preventDefault();

    active=true;

    const touch=
    e.touches[0];

    updateAim(
        touch.clientX,
        touch.clientY
    );

},
{
    passive:false
});


/*
 * MOVIMIENTO CONTINUO
 */

touchArea.addEventListener(
"touchmove",
function(e){

    e.preventDefault();

    if(!active)
        return;


    const touch=
    e.touches[0];


    updateAim(
        touch.clientX,
        touch.clientY
    );

},
{
    passive:false
});


/*
 * SOLTAR
 */

touchArea.addEventListener(
"touchend",
function(e){

    e.preventDefault();

    active=false;

    status.textContent=
        "Listo";

},
{
    passive:false
});


/*
 * CANCELAR
 */

touchArea.addEventListener(
"touchcancel",
function(){

    active=false;

});


/*
 * REINICIAR
 */

function resetAim(){

    clearTrajectory();

    drawTrajectory(0);

    status.textContent=
        "Listo";
}


/*
 * Trayectoria inicial
 */

drawTrajectory(0);

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

<title>Pool App</title>

<style>

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    touch-action:none;
}

body{
    text-align:center;
    overflow:hidden;
}

h1{
    margin:10px 0 3px;
    font-size:24px;
}

p{
    margin:0 0 8px;
    color:#aaa;
}

#table{
    position:relative;

    width:94vw;
    max-width:900px;

    aspect-ratio:2/1;

    margin:auto;

    background:#08733c;

    border:18px solid #5b321c;

    border-radius:12px;

    overflow:hidden;

    touch-action:none;
    user-select:none;
}


/* TRONERAS */

.pocket{
    position:absolute;

    width:7%;
    aspect-ratio:1;

    background:#050505;

    border-radius:50%;

    z-index:2;
}

.p1{left:-3.5%;top:-3.5%}
.p2{right:-3.5%;top:-3.5%}
.p3{left:-3.5%;bottom:-3.5%}
.p4{right:-3.5%;bottom:-3.5%}
.p5{left:46.5%;top:-5%}
.p6{left:46.5%;bottom:-5%}


/* BOLA BLANCA */

#cueBall{
    position:absolute;

    width:5%;
    aspect-ratio:1;

    left:25%;
    top:50%;

    transform:translate(-50%,-50%);

    background:white;

    border-radius:50%;

    z-index:10;

    pointer-events:none;

    box-shadow:
    0 2px 5px rgba(0,0,0,.5);
}


/* BOLA OBJETIVO */

#target{
    position:absolute;

    width:5%;
    aspect-ratio:1;

    left:70%;
    top:50%;

    transform:translate(-50%,-50%);

    background:#e63946;

    border-radius:50%;

    z-index:10;

    pointer-events:none;
}


/* TRAYECTORIA */

.trajectory{

    position:absolute;

    height:4px;

    background:white;

    transform-origin:0 50%;

    z-index:6;

    pointer-events:none;

    box-shadow:
    0 0 4px rgba(255,255,255,.8);
}


/* PUNTOS DE REBOTE */

.bounce{

    position:absolute;

    width:10px;
    height:10px;

    background:#ffd166;

    border-radius:50%;

    transform:translate(-50%,-50%);

    z-index:8;

    pointer-events:none;

    box-shadow:
    0 0 5px rgba(255,209,102,.8);
}


/* ZONA TÁCTIL */

#touchArea{

    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:100%;

    z-index:20;

    background:transparent;

    touch-action:none;
}


/* ESTADO */

#status{

    margin:8px;

    color:#aaa;

    min-height:20px;
}


/* BOTÓN */

button{

    padding:10px 20px;

    border:0;

    border-radius:8px;

    font-weight:bold;

    font-size:14px;
}

</style>

</head>


<body>

<h1>🎱 Pool App</h1>

<p>
Mantén el dedo y muévelo para apuntar
</p>


<div id="table">


    <!-- TRONERAS -->

    <div class="pocket p1"></div>
    <div class="pocket p2"></div>
    <div class="pocket p3"></div>
    <div class="pocket p4"></div>
    <div class="pocket p5"></div>
    <div class="pocket p6"></div>


    <!-- BOLA BLANCA -->

    <div id="cueBall"></div>


    <!-- BOLA OBJETIVO -->

    <div id="target"></div>


    <!-- ZONA TÁCTIL -->

    <div id="touchArea"></div>

</div>


<div id="status">
Listo
</div>


<button onclick="resetAim()">
Reiniciar
</button>


<script>


/* ELEMENTOS */

const table =
document.getElementById("table");

const touchArea =
document.getElementById("touchArea");

const status =
document.getElementById("status");


let active=false;


/*
 * RADIO DE LA BOLA
 *
 * La bola ocupa aproximadamente
 * el 5% del ancho de la mesa.
 */

function getBallRadius(){

    return table.clientWidth * 0.025;

}


/*
 * CREAR UNA LÍNEA
 */

function createLine(
    x1,
    y1,
    x2,
    y2
){

    const line =
    document.createElement("div");

    line.className =
        "trajectory";


    const dx =
        x2-x1;

    const dy =
        y2-y1;


    const length =
        Math.sqrt(
            dx*dx+
            dy*dy
        );


    const angle =
        Math.atan2(
            dy,
            dx
        );


    line.style.left =
        x1+"px";

    line.style.top =
        y1+"px";

    line.style.width =
        length+"px";

    line.style.transform =
        "rotate("+
        angle+
        "rad)";


    table.appendChild(line);

}


/*
 * CREAR PUNTO DE REBOTE
 */

function createBounce(x,y){

    const point =
        document.createElement("div");

    point.className =
        "bounce";


    point.style.left =
        x+"px";

    point.style.top =
        y+"px";


    table.appendChild(point);

}


/*
 * BORRAR TRAYECTORIA
 */

function clearTrajectory(){

    document
    .querySelectorAll(
        ".trajectory,.bounce"
    )
    .forEach(
        element =>
        element.remove()
    );

}


/*
 * CALCULAR TRAYECTORIA
 *
 * Se utilizan límites interiores
 * separados por el radio de la bola.
 */

function drawTrajectory(angle){

    clearTrajectory();


    const width =
        table.clientWidth;

    const height =
        table.clientHeight;


    const radius =
        getBallRadius();


    /*
     * Límites para el CENTRO
     * de la bola.
     */

    const left =
        radius;

    const right =
        width-radius;

    const top =
        radius;

    const bottom =
        height-radius;


    /*
     * Posición inicial
     */

    let x =
        width*0.25;

    let y =
        height*0.50;


    /*
     * Dirección

     */

    let dx =
        Math.cos(angle);

    let dy =
        Math.sin(angle);


    /*
     * Distancia total

     */

    let remaining =
        Math.max(
            width,
            height
        )*12;


    /*
     * Máximo de rebotes
     */

    let bounceCount=0;


    while(
        remaining>0 &&
        bounceCount<8
    ){


        let distanceX=
            Infinity;

        let distanceY=
            Infinity;


        /*
         * Distancia a banda
         * derecha/izquierda
         */

        if(dx>0){

            distanceX =
                (right-x)/dx;

        }
        else if(dx<0){

            distanceX =
                (left-x)/dx;

        }


        /*
         * Distancia a banda
         * superior/inferior
         */

        if(dy>0){

            distanceY =
                (bottom-y)/dy;

        }
        else if(dy<0){

            distanceY =
                (top-y)/dy;

        }


        /*
         * Próximo impacto
         */

        const distance =
            Math.min(
                distanceX,
                distanceY
            );


        /*
         * No llega a otra banda
         */

        if(
            distance>=remaining
        ){

            const endX =
                x+
                dx*remaining;

            const endY =
                y+
                dy*remaining;


            createLine(
                x,
                y,
                endX,
                endY
            );


            break;
        }


        /*
         * Punto de impacto
         */

        const hitX =
            x+
            dx*distance;

        const hitY =
            y+
            dy*distance;


        /*
         * Dibujar tramo
         */

        createLine(
            x,
            y,
            hitX,
            hitY
        );


        /*
         * Marcar rebote
         */

        createBounce(
            hitX,
            hitY
        );


        /*
         * Determinar banda
         */

        const verticalHit =
            Math.abs(
                distance-distanceX
            ) <
            Math.abs(
                distance-distanceY
            );


        if(verticalHit){

            /*
             * Rebote contra
             * banda vertical
             */

            dx =
                -dx;

        }
        else{

            /*
             * Rebote contra
             * banda horizontal
             */

            dy =
                -dy;

        }


        /*
         * Avanzar ligeramente
         * para evitar quedar
         * pegado a la banda.
         */

        x =
            hitX+
            dx*0.5;

        y =
            hitY+
            dy*0.5;


        remaining -=
            distance;


        bounceCount++;

    }

}


/*
 * ACTUALIZAR APUNTADO
 */

function updateAim(
    clientX,
    clientY
){

    const rect =
        table.getBoundingClientRect();


    /*
     * Centro de bola blanca
     */

    const ballX =
        rect.left+
        rect.width*0.25;


    const ballY =
        rect.top+
        rect.height*0.50;


    /*
     * Vector hacia el dedo
     */

    const dx =
        clientX-ballX;

    const dy =
        clientY-ballY;


    /*
     * Ángulo

     */

    const angle =
        Math.atan2(
            dy,
            dx
        );


    drawTrajectory(angle);


    status.textContent =
        "Apuntando • "+
        Math.round(
            angle*180/Math.PI
        )+
        "°";

}


/*
 * TOQUE INICIAL
 */

touchArea.addEventListener(
"touchstart",
function(e){

    e.preventDefault();

    active=true;


    const touch =
        e.touches[0];


    updateAim(
        touch.clientX,
        touch.clientY
    );

},
{
    passive:false
}
);


/*
 * MOVIMIENTO CONTINUO
 */

touchArea.addEventListener(
"touchmove",
function(e){

    e.preventDefault();


    if(!active)
        return;


    const touch =
        e.touches[0];


    updateAim(
        touch.clientX,
        touch.clientY
    );

},
{
    passive:false
}
);


/*
 * TERMINAR TOQUE
 */

touchArea.addEventListener(
"touchend",
function(e){

    e.preventDefault();

    active=false;

    status.textContent =
        "Listo";

},
{
    passive:false
}
);


/*
 * CANCELAR
 */

touchArea.addEventListener(
"touchcancel",
function(){

    active=false;

});


/*
 * REINICIAR
 */

function resetAim(){

    clearTrajectory();

    drawTrajectory(0);

    status.textContent =
        "Listo";

}


/*
 * INICIALIZAR
 */

drawTrajectory(0);


/*
 * REDIMENSIONAR
 */

window.addEventListener(
"resize",
function(){

    clearTrajectory();

    drawTrajectory(0);

});

</script>

</body>

</html>
